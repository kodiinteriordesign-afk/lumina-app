<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINÉÉ | 精密極簡・空間美學</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #FAFAFA; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            color: #1A1A1A; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        .container { 
            text-align: center; 
            opacity: 0; 
            animation: fadeIn 2.5s ease-out forwards; 
            padding-bottom: 50px; /* 為底部留出空間 */
        }

        h1 { 
            font-weight: 100; 
            font-size: 2.8rem; 
            margin: 0;
            letter-spacing: 0.35em; 
            text-transform: uppercase;
        }

        .tagline { 
            font-weight: 200; 
            font-size: 0.85rem; 
            color: #888; 
            margin-top: 15px;
            letter-spacing: 0.3em; /* 稍微拉寬，對齊標題的視覺寬度 */
        }

        nav {
            margin-top: 80px; /* 增加間距，讓中間視覺更平衡 */
        }

        nav a {
            text-decoration: none;
            color: #999;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            margin: 0 25px;
            transition: color 0.4s ease;
            cursor: pointer;
        }

        nav a:hover { color: #000; }

        /* 將版權資訊移到最底，不干擾中心視線 */
        .footer { 
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem; 
            color: #CCC; 
            letter-spacing: 0.15em;
            font-weight: 200;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LUMINÉÉ</h1>
        <div class="tagline">精密 · 極簡 · 永恆</div>
        
        <nav>
            <a onclick="alert('作品集策展中...')">WORKS</a>
            <a onclick="alert('品牌故事編寫中...')">ABOUT</a>
            <a onclick="alert('聯絡方式即將開啟...')">CONTACT</a>
        </nav>
    </div>

    <div class="footer">© 2026 LUMINÉÉ. ALL RIGHTS RESERVED.</div>
</body>
</html>
